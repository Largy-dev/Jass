name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Jass-Score.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jass-Score-APK
          path: release/Jass-Score.apk
          retention-days: 30

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Delete existing release if exists
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest-build
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Jass Score — Build ${{ steps.date.outputs.date }}"
          body: |
            ## Jass Score — APK Android

            Télécharge le fichier `Jass-Score.apk` ci-dessous et installe-le sur ton téléphone Android.

            > **Note :** Avant d'installer, active *"Sources inconnues"* dans les paramètres Android
            > (Paramètres → Sécurité → Installer des applications inconnues).

            ### Fonctionnalités
            - Ardoise en Z par équipe : tap = +1 barre, appui long = −1 barre
            - Saisie de manche avec pavé numérique, Match (257) et pique double ×2
            - Annonces (Wys 20 à 200) et Stöck
            - Retenue cumulée entre manches
            - Objectif configurable (1500 par défaut) avec annonce du vainqueur
            - Historique, annulation de la dernière action, sauvegarde automatique
          files: release/Jass-Score.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
