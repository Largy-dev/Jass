name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    env:
      # versionCode = numéro du run : toujours croissant, donc chaque APK met à jour le précédent
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # le paquet « tools » installé par défaut n'existe plus ; Gradle télécharge le reste
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Sans signature stable, chaque APK aurait une clé différente et Android
      # refuserait la mise à jour : on échoue plutôt que de publier un APK inutilisable.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JASS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JASS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JASS_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secrets de signature manquants (JASS_KEYSTORE_BASE64, JASS_KEYSTORE_PASSWORD, JASS_KEY_ALIAS). Voir README, section Signature."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jass-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/jass-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "JASS_SIGNING_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Jass-Score.apk
          cp app/build/outputs/bundle/release/app-release.aab release/Jass-Score.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jass-Score-${{ github.run_number }}
          path: release/
          retention-days: 30

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Delete existing release if exists
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest-build
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Jass Score 2.0.${{ github.run_number }} — ${{ steps.date.outputs.date }}"
          body: |
            ## Jass Score 2.0.${{ github.run_number }}

            Télécharge `Jass-Score.apk` ci-dessous et ouvre-le sur ton téléphone Android.
            Si une version 2.0.x signée est déjà installée, elle est **mise à jour** et ta partie est conservée.

            > Première installation : autorise « Installer des applications inconnues » pour ton navigateur.

            `Jass-Score.aab` est le bundle destiné au Google Play Store.

            ### Fonctionnalités
            - Ardoise en Z par équipe : tap = +1 barre, appui long = −1 barre
            - Saisie de manche avec pavé numérique, Match (257) et pique double ×2
            - Annonces (Wys 20 à 200) et Stöck
            - Retenue cumulée entre manches
            - Objectif configurable (1500 par défaut) avec annonce du vainqueur
            - Historique, annulation de la dernière action, sauvegarde automatique
          files: |
            release/Jass-Score.apk
            release/Jass-Score.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
